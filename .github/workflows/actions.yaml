name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  integrity:
    uses: ./.github/workflows/integrity.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  test:
    needs: integrity
    uses: ./.github/workflows/test.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  publish:
    needs: [integrity, test]
    uses: ./.github/workflows/publish.yaml
    with:
      current_version: ${{ needs.integrity.outputs.current_version }}
    permissions:
      contents: read
      packages: write
    secrets: inherit
