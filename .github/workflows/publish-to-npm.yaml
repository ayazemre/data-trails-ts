name: Publish to NPM
on:
  workflow_dispatch:
jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: "Run Tests"
        run: |
          cd edium-core-library
          npm install
          npm run test
          npm run build
